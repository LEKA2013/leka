[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leka"
version = "0.1.0"
description = "Pipeline climático Amazônia Legal — MERGE + ERA5 (CENSIPAM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Letícia Cardoso" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "h5netcdf>=1.1",
  "cfgrib>=0.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "matplotlib>=3.7",
  "cartopy>=0.22",
  "jupyter>=1.0",
  "ipykernel>=6.25",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
